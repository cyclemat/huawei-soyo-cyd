[env:cyd]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 4800
; Mehr Platz fuer die Firmware (LVGL + Schriften). Kein OTA, Einstellungen (NVS) bleiben erhalten.
board_build.partitions = huge_app.csv
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
lib_deps =
    lovyan03/LovyanGFX @ 1.3.0
    knolleary/PubSubClient @ 2.8
    lvgl/lvgl @ 8.4.0



[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 4800
; Mehr Platz fuer die Firmware (LVGL + Schriften). Kein OTA, Einstellungen (NVS) bleiben erhalten.
board_build.partitions = huge_app.csv
; Startbild (assets/splash_cyd.jpg oder eigene splash_cyd.jpg im Projektordner) einbetten
extra_scripts = pre:tools/embed_splash.py
build_flags =
    ; keine Log-Ausgaben: der serielle Anschluss (UART0) ist der Soyo-RS485-Bus
    -D CORE_DEBUG_LEVEL=0
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
lib_deps =
    lovyan03/LovyanGFX @ 1.3.0
    knolleary/PubSubClient @ 2.8
    lvgl/lvgl @ 8.4.0

; Dieselbe Firmware mit Englisch als Sprache ab Werk (Weboberflaeche und Display). Bauen: pio run -e cyd-en
[env:cyd-en]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -D DEFAULT_LANG=1


